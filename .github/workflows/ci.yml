name: Backend CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install locked dependencies
        run: python -m pip install --require-hashes --requirement requirements.lock.txt

      - name: Run offline unit tests
        run: python -m pytest tests/unit -q

      - name: Validate EC2 deploy script
        run: bash -n deploy/aws/meraki-deploy deploy/aws/bootstrap-uat.sh

      - name: Audit application dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --progress-spinner off --requirement requirements.lock.txt

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: backend
            dockerfile: Dockerfile
          - name: manim-renderer
            dockerfile: render.Dockerfile
          - name: remotion-renderer
            dockerfile: remotion.Dockerfile
    steps:
      - uses: actions/checkout@v7
      - name: Build ${{ matrix.image.name }} production image
        run: >-
          docker build
          --file ${{ matrix.image.dockerfile }}
          --tag merakiai-${{ matrix.image.name }}:${{ github.sha }}
          .

  deploy-uat:
    name: Deploy to UAT
    needs: [test-and-audit, container-build]
    # A separate UAT instance is optional. Do not turn a successful dev build
    # red merely because this project currently operates production only.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev' &&
      vars.UAT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: uat
      url: ${{ vars.UAT_API_URL }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy tested commit through SSM
        id: deploy
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["set -e","if [ ! -f /etc/meraki/uat-bootstrapped ]; then curl --fail --silent --show-error --location https://raw.githubusercontent.com/meraki-ai-pro/merakiai-backend/${{ github.sha }}/deploy/aws/bootstrap-uat.sh --output /tmp/bootstrap-uat.sh; sudo bash /tmp/bootstrap-uat.sh ${{ github.sha }} ${{ vars.UAT_SECRET_ARN }}; fi","curl --fail --silent --show-error --location https://raw.githubusercontent.com/meraki-ai-pro/merakiai-backend/${{ github.sha }}/deploy/aws/meraki-deploy --output /tmp/meraki-deploy","sudo install --owner root --group root --mode 0755 /tmp/meraki-deploy /usr/local/sbin/meraki-deploy","sudo /usr/local/sbin/meraki-deploy ${{ github.sha }} uat"]' \
            --comment 'Meraki UAT ${{ github.sha }}' \
            --query 'Command.CommandId' --output text)"
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"

      - name: Verify SSM result
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          status=Pending
          for attempt in $(seq 1 60); do
            status="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 10
          done
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}'
          test "$status" = Success

      - name: Verify public UAT endpoint
        env:
          API_URL: ${{ vars.UAT_API_URL }}
        run: curl --fail --show-error --silent --retry 5 --retry-delay 5 "$API_URL/health"

  capacity-test-uat:
    name: Run staged UAT capacity test
    needs: deploy-uat
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev' &&
      vars.UAT_CAPACITY_TEST == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: uat
      url: ${{ vars.UAT_API_URL }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Start isolated staged test through SSM
        id: capacity
        env:
          API_URL: ${{ vars.UAT_API_URL }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          SECRET_ARN: ${{ vars.UAT_SECRET_ARN }}
        run: |
          test_command="sudo -u meraki /srv/meraki-uat/.venv/bin/python /srv/meraki-uat/merakiai-backend/scripts/run_uat_capacity.py --base-url $API_URL --secret-id $SECRET_ARN --cohorts 25 50 100 200"
          parameters="$(jq -cn --arg test_command "$test_command" '{commands:["set -e","sudo systemctl is-active meraki-api-uat meraki-celery-text-uat meraki-celery-video-uat meraki-celery-ingestion-uat nginx redis-server rabbitmq-server",$test_command]}')"
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$parameters" \
            --comment 'Meraki staged UAT capacity test' \
            --timeout-seconds 1500 \
            --query 'Command.CommandId' --output text)"
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"

      - name: Collect staged test results
        env:
          COMMAND_ID: ${{ steps.capacity.outputs.command_id }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          status=Pending
          for attempt in $(seq 1 150); do
            status="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 10
          done
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}'
          test "$status" = Success

  ai-workload-test-uat:
    name: Run staged UAT AI workload test
    needs: deploy-uat
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev' &&
      vars.UAT_AI_WORKLOAD_TEST == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: uat
      url: ${{ vars.UAT_API_URL }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Start isolated AI workload test through SSM
        id: ai_workload
        env:
          AI_COHORTS: ${{ vars.UAT_AI_WORKLOAD_COHORTS || '10 25 50 100 200' }}
          AI_WORKER_CONCURRENCY: ${{ vars.UAT_AI_WORKER_CONCURRENCY || '8' }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.UAT_ANTHROPIC_WORKSPACE_ID }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          SECRET_ARN: ${{ vars.UAT_SECRET_ARN }}
        run: |
          test -n "$ANTHROPIC_WORKSPACE_ID"
          workspace_id_b64="$(printf '%s' "$ANTHROPIC_WORKSPACE_ID" | base64 -w0)"
          configure_command="set -e; value=\$(printf '%s' '$workspace_id_b64' | base64 -d); sed -i '/^ANTHROPIC_WORKSPACE_ID=/d' /etc/meraki/backend-uat.env; printf 'ANTHROPIC_WORKSPACE_ID=%s\\n' \"\$value\" >> /etc/meraki/backend-uat.env; systemctl restart meraki-api-uat meraki-celery-text-uat meraki-celery-video-uat meraki-celery-ingestion-uat; systemctl is-active meraki-api-uat meraki-celery-text-uat meraki-celery-video-uat meraki-celery-ingestion-uat"
          test_command="sudo -u meraki env ANTHROPIC_WORKSPACE_ID=$ANTHROPIC_WORKSPACE_ID /srv/meraki-uat/.venv/bin/python /srv/meraki-uat/merakiai-backend/scripts/run_uat_ai_workload.py --secret-id $SECRET_ARN --cohorts $AI_COHORTS --active-ratio 0.20 --review-ratio 0.20 --worker-concurrency $AI_WORKER_CONCURRENCY --stop-on-failure"
          parameters="$(jq -cn --arg configure_command "$configure_command" --arg test_command "$test_command" '{commands:["set -e","systemctl is-active nginx redis-server rabbitmq-server",$configure_command,$test_command]}')"
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$parameters" \
            --comment 'Meraki staged UAT AI workload test' \
            --timeout-seconds 3300 \
            --query 'Command.CommandId' --output text)"
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"

      - name: Collect AI workload results
        env:
          COMMAND_ID: ${{ steps.ai_workload.outputs.command_id }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          status=Pending
          for attempt in $(seq 1 330); do
            status="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 10
          done
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}'
          test "$status" = Success

  deploy-production:
    name: Deploy to production
    needs: [test-and-audit, container-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PROD_API_URL }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          # Repository/environment variables remain override points, while the
          # verified production identifiers keep a missing variable from
          # turning an otherwise healthy release red before it reaches AWS.
          role-to-assume: ${{ vars.AWS_ROLE_ARN || 'arn:aws:iam::335723620926:role/MerakiGitHubProdDeployRole' }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Deploy tested commit through SSM
        id: deploy
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID || 'i-0d4a8e0177f8d24ed' }}
        run: |
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["set -e","curl --fail --silent --show-error --location https://raw.githubusercontent.com/meraki-ai-pro/merakiai-backend/${{ github.sha }}/deploy/aws/meraki-deploy --output /tmp/meraki-deploy","sudo install --owner root --group root --mode 0755 /tmp/meraki-deploy /usr/local/sbin/meraki-deploy","sudo /usr/local/sbin/meraki-deploy ${{ github.sha }} production"]' \
            --comment 'Meraki production ${{ github.sha }}' \
            --query 'Command.CommandId' --output text)"
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"

      - name: Verify SSM result
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID || 'i-0d4a8e0177f8d24ed' }}
        run: |
          # The built-in waiter gives up after roughly 100 seconds. A cold
          # Manim/TeX image build legitimately takes longer on the production
          # instance, so poll terminal states for up to ten minutes.
          status=Pending
          for attempt in $(seq 1 60); do
            status="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 10
          done
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}'
          test "$status" = Success

      - name: Verify public production endpoint
        env:
          API_URL: ${{ vars.PROD_API_URL || 'https://api.merakiai.online' }}
        run: curl --fail --show-error --silent --retry 5 --retry-delay 5 "$API_URL/health"
