[pytest]
asyncio_mode = auto

markers =
    unit: pure unit tests — no external services required
    e2e: end-to-end tests — requires the full stack to be running
    adversarial: robustness and security tests
    slow: tests that may take longer than 30 seconds (AI calls)

# Default: run unit tests only (fast feedback loop)
# To run everything:  pytest
# To run only e2e:    pytest -m e2e
# To run only unit:   pytest -m unit
# To run adversarial: pytest -m adversarial
addopts = -v --tb=short
